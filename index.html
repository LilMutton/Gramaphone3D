<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gramaphone 3D Model</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: white;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            display: block;
            background-color: white;
        }
    </style>
</head>

<body>

    <model-viewer
        src="https://lilmutton.github.io/Gramaphone3D/Gramaphone.glb"
        camera-controls
        shadow-intensity="1"
        exposure="1"
        alt="Interactive Gramaphone 3D Model">
    </model-viewer>

</body>

</html>

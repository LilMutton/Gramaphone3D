<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gramaphone3D Model</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: white;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div id="loading">Loading 3D Model...</div>

    <model-viewer
        id="model"
        src="./Gramaphone.glb"
        camera-controls
        shadow-intensity="1"
        exposure="1">
    </model-viewer>

    <script>
        const model = document.getElementById("model");
        const loading = document.getElementById("loading");

        model.addEventListener("load", () => {
            loading.style.display = "none";
        });

        model.addEventListener("error", () => {
            loading.textContent = "ERROR: Could not load Gramaphone.glb";
        });
    </script>

</body>

</html>

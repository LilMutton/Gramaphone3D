<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gramaphone 3D Model</title>

    <!-- 3D Model Viewer -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        model-viewer {
            display: block;
            width: 100%;
            height: 100%;
            background-color: white;
        }
    </style>
</head>

<body>

    <model-viewer
        src="Gramaphone.glb"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1"
        interaction-prompt="auto"
        alt="Interactive 3D Gramaphone model">
    </model-viewer>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gramaphone 3D Model</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
        }
    </style>
</head>

<body>

    <model-viewer
        src="Gramaphone.glb"
        camera-controls
        shadow-intensity="1">
    </model-viewer>

</body>

</html>
